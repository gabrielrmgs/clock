<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizacao de Relogios</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f7f8fb;
            --surface: #ffffff;
            --text: #20242c;
            --muted: #687386;
            --line: #dce2ea;
            --primary: #1769aa;
            --primary-dark: #104f81;
            --danger: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.05;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 1.25rem;
        }

        p {
            margin: 0;
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
            margin-top: 28px;
            align-items: start;
        }

        section,
        .status {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 10px;
            color: var(--text);
            font: inherit;
            background: #fff;
        }

        button {
            min-height: 42px;
            border: 0;
            border-radius: 6px;
            padding: 0 14px;
            color: #fff;
            background: var(--primary);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button.secondary {
            color: var(--primary);
            background: #e8f2fb;
        }

        button.secondary:hover {
            background: #d8eafa;
        }

        button.danger {
            color: var(--danger);
            background: #fff0ee;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cliente {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfcfe;
        }

        .clientes {
            display: grid;
            gap: 12px;
        }

        .status {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .metric {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            background: #fbfcfe;
        }

        .metric strong {
            display: block;
            margin-top: 6px;
            font-size: 1.35rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: 0.82rem;
            text-transform: uppercase;
        }

        .mensagem {
            min-height: 22px;
            color: var(--muted);
            font-weight: 700;
        }

        .erro {
            color: var(--danger);
        }

        @media (max-width: 860px) {
            .layout,
            .status-grid,
            .cliente {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Sincronizacao de Relogios</h1>
    <p>Crie o servidor, adicione quantos clientes precisar e sincronize tudo em uma unica tela.</p>

    <div class="layout">
        <section>
            <h2>Servidor</h2>
            <form id="servidor-form">
                <label>
                    Hora do servidor
                    <input id="hora-servidor" name="horaServidor" type="time" step="1" required>
                </label>
                <button type="submit">Criar servidor</button>
            </form>
        </section>

        <section>
            <h2>Clientes</h2>
            <form id="clientes-form">
                <div id="clientes" class="clientes"></div>
                <div class="actions">
                    <button class="secondary" type="button" id="adicionar-cliente">Adicionar cliente</button>
                    <button type="submit">Criar clientes</button>
                </div>
            </form>
        </section>
    </div>

    <div class="status">
        <div class="mensagem" id="mensagem"></div>
        <div class="status-grid">
            <div class="metric">
                <span>Servidor</span>
                <strong id="status-servidor">--</strong>
            </div>
            <div class="metric">
                <span>Clock logico</span>
                <strong id="status-clock">--</strong>
            </div>
            <div class="metric">
                <span>Clientes</span>
                <strong id="status-clientes">0</strong>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>Cliente</th>
                <th>Hora local</th>
                <th>Hora de envio</th>
                <th>Diferenca</th>
            </tr>
            </thead>
            <tbody id="tabela-clientes">
            <tr>
                <td colspan="4">Nenhum cliente criado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<template id="cliente-template">
    <div class="cliente">
        <label>
            Nome
            <input name="nomeCliente" type="text" required>
        </label>
        <label>
            Hora local
            <input name="horaLocal" type="time" step="1" required>
        </label>
        <label>
            Hora de envio
            <input name="horaEnvio" type="time" step="1">
        </label>
        <button class="danger" type="button">Remover</button>
    </div>
</template>

<script>
    const clientesEl = document.querySelector("#clientes");
    const clienteTemplate = document.querySelector("#cliente-template");
    const mensagemEl = document.querySelector("#mensagem");
    const statusServidorEl = document.querySelector("#status-servidor");
    const statusClockEl = document.querySelector("#status-clock");
    const statusClientesEl = document.querySelector("#status-clientes");
    const tabelaClientesEl = document.querySelector("#tabela-clientes");

    function horaAtual() {
        return new Date().toTimeString().slice(0, 8);
    }

    function mostrarMensagem(texto, erro = false) {
        mensagemEl.textContent = texto;
        mensagemEl.classList.toggle("erro", erro);
    }

    function adicionarCliente() {
        const clone = clienteTemplate.content.cloneNode(true);
        const cliente = clone.querySelector(".cliente");
        const total = clientesEl.children.length + 1;

        cliente.querySelector("[name='nomeCliente']").value = "Cliente " + total;
        cliente.querySelector("[name='horaLocal']").value = horaAtual();
        cliente.querySelector("[name='horaEnvio']").value = horaAtual();
        cliente.querySelector("button").addEventListener("click", () => cliente.remove());

        clientesEl.appendChild(clone);
    }

    async function enviarJson(url, dados) {
        const resposta = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        });

        const texto = await resposta.text();
        if (!resposta.ok) {
            throw new Error(texto || "Nao foi possivel concluir a operacao.");
        }

        return texto;
    }

    async function atualizarStatus() {
        const servidorResposta = await fetch("/sd/servidor");
        if (servidorResposta.ok) {
            const servidor = await servidorResposta.json();
            statusServidorEl.textContent = servidor.horaServidor || "--";
        } else {
            statusServidorEl.textContent = "--";
        }

        const clockResposta = await fetch("/sd/clockLogico");
        const clockTexto = await clockResposta.text();
        statusClockEl.textContent = clockTexto && clockTexto !== "null" ? clockTexto : "--";

        const clientesResposta = await fetch("/sd/clientes");
        const clientes = clientesResposta.ok ? await clientesResposta.json() : [];
        statusClientesEl.textContent = clientes.length;
        renderizarClientes(clientes);
    }

    function renderizarClientes(clientes) {
        if (!clientes.length) {
            tabelaClientesEl.innerHTML = "<tr><td colspan=\"4\">Nenhum cliente criado.</td></tr>";
            return;
        }

        tabelaClientesEl.innerHTML = clientes.map((cliente) => (
            "<tr>" +
            "<td>" + cliente.nomeCliente + "</td>" +
            "<td>" + cliente.horaLocalCliente + "</td>" +
            "<td>" + cliente.horaEnvioCliente + "</td>" +
            "<td>" + (cliente.difHora || "--") + "</td>" +
            "</tr>"
        )).join("");
    }

    document.querySelector("#adicionar-cliente").addEventListener("click", adicionarCliente);

    document.querySelector("#servidor-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const horaServidor = document.querySelector("#hora-servidor").value;

        try {
            const resposta = await enviarJson("/sd/criarServidor", { horaServidor });
            mostrarMensagem(resposta);
            await atualizarStatus();
        } catch (erro) {
            mostrarMensagem(erro.message, true);
        }
    });

    document.querySelector("#clientes-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const clientes = Array.from(clientesEl.querySelectorAll(".cliente"));

        if (!clientes.length) {
            mostrarMensagem("Adicione pelo menos um cliente.", true);
            return;
        }

        try {
            for (const cliente of clientes) {
                const nomeCliente = cliente.querySelector("[name='nomeCliente']").value;
                const horaLocal = cliente.querySelector("[name='horaLocal']").value;
                const horaEnvio = cliente.querySelector("[name='horaEnvio']").value || horaAtual();

                await enviarJson("/sd/sincronizarCliente", { nomeCliente, horaLocal, horaEnvio });
            }

            mostrarMensagem("Clientes criados e sincronizados.");
            clientesEl.innerHTML = "";
            adicionarCliente();
            await atualizarStatus();
        } catch (erro) {
            mostrarMensagem(erro.message, true);
        }
    });

    document.querySelector("#hora-servidor").value = horaAtual();
    adicionarCliente();
    atualizarStatus();
</script>
</body>
</html>
